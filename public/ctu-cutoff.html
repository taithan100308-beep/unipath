  <style>
 body {
      font-family: 'Poppins', sans-serif;
      background: #ffffff;
      padding-top: 80px;
    }
    .cutoff-container {
      max-width: 850px;
      margin: auto;
      background: #fff;
      border-radius: 1.2rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    select, button {
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-right: 10px;
    }
    button {
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f0f7ff;
      color: #004aad;
    }
     .result-box {
      display: none;
      margin-top: 2rem;
      padding: 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      color: white;
    }
    
    .result-box.show {
      display: block;
      animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .result-item {
      margin-bottom: 0.8rem;
    }
    
    .result-label {
      font-weight: 600;
      opacity: 0.9;
      font-size: 0.9rem;
    }
    
    .result-value {
      font-size: 1.1rem;
      margin-top: 0.2rem;
    }
    
    .result-score {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin: 1rem 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .no-result {
      text-align: center;
      padding: 2rem;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
